[project]
name = "jobtron6900"
version = "0.1.0"
description = "Local application tracker with reviewable answers, cover letters, and dated bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.16",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "mcp>=2.1,<3",
  "platformdirs>=4.3",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]

[project.scripts]
jobtron-mcp = "app.mcp.server:run_stdio"
jobtron-setup = "app.config:setup_main"
jobtron = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
