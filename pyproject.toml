[project]
name = "jobtron6900"
version = "0.1.0"
description = "Local-first, agent-driven job application workspace with MCP review UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "jinja2>=3.1",
  "mcp>=2.1,<3",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
test = ["httpx>=0.28", "pytest>=8.4"]

[project.scripts]
jobtron-mcp = "app.mcp.server:run_stdio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
